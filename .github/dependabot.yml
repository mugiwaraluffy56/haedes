version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /services/control-plane
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /services/lifecycle-manager
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /services/snapshot-service
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infrastructure/terraform
    schedule:
      interval: weekly
