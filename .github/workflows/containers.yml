name: Containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  containers:
    name: Build and smoke test containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@v3
      - run: make check-containers

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: haedes-sandbox-base:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: haedes-sandbox-dev:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: haedes-control-plane:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
