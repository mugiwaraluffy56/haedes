[package]
name = "haedes-sandbox-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.7"
nix = { version = "0.29", features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
