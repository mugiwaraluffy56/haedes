[package]
name = "haedes-sandbox-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-stream = "0.3"
axum = "0.7"
hex = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tar = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "fs", "io-util"] }
zstd = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
