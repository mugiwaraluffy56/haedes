name: haedes-local

services:
  control-plane:
    build:
      context: ../..
      dockerfile: infrastructure/docker/control-plane.Dockerfile
      args:
        BUILD_SHA: ${HAEDES_BUILD_SHA:-dev}
    environment:
      HAEDES_CONTROL_PLANE_BIND: 0.0.0.0:8080
      HAEDES_LOCAL_API_KEY: ${HAEDES_LOCAL_API_KEY:-local-api-key}
      HAEDES_RUNTIME_ENDPOINT: http://sandbox-runtime:8080
    depends_on:
      sandbox-runtime:
        condition: service_healthy
    ports:
      - "${HAEDES_CONTROL_PLANE_PORT:-18080}:8080"
    networks:
      - local
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  sandbox-runtime:
    image: ${HAEDES_SANDBOX_IMAGE:-haedes-sandbox-dev:dev}
    environment:
      HAEDES_RUNTIME_BIND: 0.0.0.0:8080
      HAEDES_RUNTIME_TOKEN: ${HAEDES_RUNTIME_TOKEN:-local-runtime-token}
      HAEDES_SANDBOX_ID: sbx_local_runtime
    expose:
      - "8080"
    networks:
      - local
    read_only: true
    tmpfs:
      - /workspace:uid=10001,gid=10001,mode=0750
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  local:
    internal: true
